[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = [
    "B008",  # Do not perform function call in argument defaults (FastAPI Depends/File/Form)
    "E501",  # Line length handled by black
]
